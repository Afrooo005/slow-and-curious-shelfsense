<script>
'use strict';
const ASOF='2026-09-26',KEY='slow-curious-shelfsense-v1',DAY=86400000;
const original=[['S01','Fresh milk 500 ml','Dairy',42,24,30,2,1,20],['S02','Whole wheat bread','Bakery',30,30,40,3,1,5],['S03','Plain yogurt 200 g','Dairy',50,20,28,4,2,7],['S04','Paneer 200 g','Dairy',8,65,85,5,2,6],['S05','Farm eggs 6 pack','Fresh',24,45,60,10,2,5],['S06','Orange juice 1 L','Drinks',45,70,95,6,3,2],['S07','Rolled oats 500 g','Pantry',18,60,90,30,4,4],['S08','Basmati rice 1 kg','Pantry',12,65,85,60,3,8],['S09','Biscuits 100 g','Pantry',40,12,20,45,2,9],['S10','Potato chips 50 g','Snacks',9,12,20,40,2,8],['S11','Red apples 1 kg','Fresh',15,90,120,8,2,3],['S12','Cherry tomatoes 250 g','Fresh',20,25,40,9,2,3]];
const dateAdd=(d,n)=>new Date(Date.parse(d+'T00:00:00Z')+n*DAY).toISOString().slice(0,10);
const base=()=>original.map((p,i)=>({sku:p[0],name:p[1],category:p[2],stock:p[3],cost:p[4],price:p[5],expiry:dateAdd(ASOF,p[6]),lead:p[7],unit:'packs',history:Array.from({length:28},(_,j)=>Math.max(0,Math.round(p[8]+((j*7+i*3)%5)-2+(i%3===0?j*.1:0))))}));
function initial(){return {products:base(),shop:'Green Basket',buffer:2,reviewed:null};}
let state=initial(),storageOK=true;
try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.products)&&x.products.every(p=>p&&typeof p.sku==='string'&&typeof p.name==='string'&&Number.isFinite(p.stock)&&Array.isArray(p.history))){state={...initial(),...x};}}catch(e){storageOK=false;}
const money=x=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(x);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const days=p=>Math.round((Date.parse(p.expiry+'T00:00:00Z')-Date.parse(ASOF+'T00:00:00Z'))/DAY);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true;}catch(e){storageOK=false;toast('Browser storage unavailable. Changes last only for this visit.');return false;}}
let toastTimer;function toast(s){document.querySelector('#toast').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.querySelector('#toast').textContent='',4500);}
function trend(h){const n=h.length;if(n<2)return {a:h[0]||0,b:0};let sx=0,sy=0,sxy=0,sxx=0;h.forEach((y,x)=>{sx+=x;sy+=y;sxy+=x*y;sxx+=x*x;});let b=(n*sxy-sx*sy)/(n*sxx-sx*sx);return {a:(sy-b*sx)/n,b};}
const mean=h=>h.length?h.reduce((a,b)=>a+b,0)/h.length:0;
function forecast(p){let h=p.history;if(h.length<14)return {daily:0,total:0,method:'More sales history needed',mae:null};const train=h.slice(0,-7),test=h.slice(-7),t=trend(train),avg=mean(train.slice(-7));const lin=mean(test.map((y,i)=>Math.abs(y-Math.max(0,t.a+t.b*(train.length+i))))),recent=mean(test.map(y=>Math.abs(y-avg)));const use=lin<recent,all=trend(h),pred=Array.from({length:7},(_,i)=>Math.max(0,use?all.a+all.b*(h.length+i):mean(h.slice(-7))));return {daily:mean(pred),total:Math.round(pred.reduce((a,b)=>a+b,0)),method:use?'Linear trend':'Recent 7-day mean',mae:Math.min(lin,recent)};}
function analyze(p){const f=forecast(p),d=days(p);return {...p,...f,days:d,reorder:Math.max(0,Math.ceil(f.daily*(p.lead+state.buffer)-p.stock)),excess:d>=0?Math.max(0,Math.ceil(p.stock-f.daily*d)):p.stock};}
const analyses=()=>state.products.map(analyze);

const tag=p=>p.days<0?'<span class="badge bad">Expired</span>':p.days<=7?`<span class="badge warn">${p.days===0?'Expires today':p.days+' days left'}</span>`:p.reorder>0?'<span class="badge warn">Reorder</span>':'<span class="badge">In stock</span>';

s="grid3"><article class="feature"><span class="num">01 / RECORD</span><h3>Start with your stock.</h3><p>Explore 12 sample products, find an item, correct its quantity or add something new.</p><a href="#inventory">Open inventory</a></article><article class="feature"><span class="num">02 / UNDERSTAND</span><h3>Ask a useful question.</h3><p>Find expiry priorities, stock value, recent top sellers and estimated demand in plain language.</p><a href="#ask">Meet the assistant</a></article><article class="feature"><span class="num">03 / DECIDE</span><h3>Review your next order.</h3><p>See suggested quantities based on sales and lead times, then download a list to check with suppliers.</p><a href="#orders">See the reorder plan</a></article></div></section><section class="dark"><div><p class="eyebrow">Your shop, in plain language</p><h2>“What should I<br>reorder?”</h2><p class="muted">An answer should show its working. ShelfSense connects your question to product records and simple demand estimates.</p><a class="btn lime" href="#ask">Ask ShelfSense</a></div><div class="questionbox"><blockquote>Stock. Recent sales.<br>Delivery time.<br>A suggestion you can check.</blockquote><p class="muted">Try five question types using synthetic sales history. No supplier order is sent automatically.</p><span class="badge">Working browser demo</span></div></section><section class="section split" id="pricing"><div><p class="eyebrow">Made for a neighbourhood routine</p><h2>Start small.<br>Prove the value.</h2><p class="muted">We’re Slow and Curious, the student team behind ShelfSense. Our next step is to learn from grocery owners and test whether clearer stock decisions save time.</p><p class="source">UNEP reports that retail accounted for 12% of global food waste in 2022. This is global context, not a measured result for ShelfSense. We have no customer testimonials or pilot outcomes yet.</p><a class="small" href="https://www.unep.org/news-and-stories/press-release/world-squanders-over-1-billion-meals-day-un-report" target="_blank" rel="noopener">Read the research</a></div><div class="pricing"><p class="eyebrow">Proposed pilot plan</p><div class="price">₹599<span style="font-size:16px;letter-spacing:0;font-weight:400"> / shop / month</span></div><ul><li>Daily expiry and stock review</li><li>Demand estimates with clear inputs</li><li>Inventory questions and reorder lists</li></ul><a href="#today" class="btn">Try the free sample</a><p class="small" style="margin:15px 0 0">Concept pricing, excluding applicable taxes. No payment or subscription is created.</p></div></section><section class="section split" style="padding-top:0"><div><p class="eyebrow">Before you explore</p><h2>A few good questions.</h2><a href="https://www.figma.com/design/kTBMfijZqGjV10D6lQP1h4/Selfsensess" target="_blank" rel="noopener">Explore our Figma design</a></div><div class="faq"><details><summary>Is this a working product?</summary><p>This is a working student demonstration. You can edit sample inventory, ask supported questions and download a plan. It has no shared shop accounts, live supplier connection or payment system.</p></details><details><summary>Where does my data go?</summary><p>Inventory edits stay in this browser’s local storage. We do not collect pilot emails here. Clearing browser data removes saved edits. Avoid entering private shop or customer information.</p></details><details><summary>What powers the assistant?</summary><p>A small Naive Bayes classifier routes five question types. Answers use inventory calculations; demand estimates compare a linear trend with a recent-sales average. This is not a general-purpose chatbot.</p></details><details><summary>Can I use it on my phone?</summary><p>Yes. The site works on mobile and desktop. Each browser keeps its own sample workspace.</p></details></div></section></div>`;}
function today(){let a=analyses(),exp=a.filter(p=>p.days>=0&&p.days<=7).sort((a,b)=>a.days-b.days),re=a.filter(p=>p.reorder>0),expired=a.filter(p=>p.days<0);return shell('today',`<div class="heading"><div><h1>A good day starts here.</h1><p class="muted">Your shelves. One clear plan.</p></div><a class="btn secondary" href="#inventory">View inventory</a></div><div class="stats"><div class="stat"><b>${state.products.length}</b><span>Products in your shop</span></div><div class="stat"><b>${exp.length}</b><span>Expiring within 7 days</span></div><div class="stat"><b>${re.length}</b><span>Products to reorder</span></div><div class="stat"><b>${money(a.reduce((n,p)=>n+p.stock*p.cost,0))}</b><span>Stock at purchase cost</span></div></div>${expired.length?`<p class="notice">${expired.length} product(s) are past their sample expiry date. Keep expired stock out of sale.</p>`:''}<div class="twocol"><article class="panel"><h2>Sell-first review</h2><p class="muted small">Inspect packaging and condition before taking action.</p>${exp.length?exp.slice(0,5).map(p=>`<div class="row"><div><p><strong>${esc(p.name)}</strong></p><p class="small">${p.stock} ${esc(p.unit)} · ${p.excess} estimated surplus</p></div>${tag(p)}</div>`).join(''):'<p>No products expire in the next seven days.</p>'}<a href="#inventory" class="textlink">Check stock and dates</a></article><article class="panel"><h2>Next order</h2><p class="muted small">Based on sample demand, lead time and a ${state.buffer}-day buffer.</p>${re.length?re.slice(0,5).map(p=>`<div class="row"><div><p><strong>${esc(p.name)}</strong></p><p class="small">${p.daily.toFixed(1)} units/day · ${p.lead}-day lead time</p></div><strong>+${p.reorder}</strong></div>`).join(''):'<p>No replenishment suggested for the current stock.</p>'}<a href="#orders" class="textlink">Review the full plan</a></article></div>`);}
let filters={q:'',category:'all',status:'all'};
function inventory(){return shell('inventory',`<div class="heading"><div><h1>Your inventory.</h1><p class="muted">Keep the numbers on your shelves up to date.</p></div><button data-action="add">Add product</button></div><div class="toolbar"><label>Search products<input id="search" placeholder="Product name or SKU" value="${esc(filters.q)}"></label><label>Category<select id="category"><option value="all">All categories</option>${[...new Set(state.products.map(p=>p.category))].sort().map(c=>`<option ${filters.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>Stock status<select id="status">${[['all','All products'],['expiry','Expiring within 7 days'],['low','Reorder suggested'],['expired','Expired']].map(([v,l])=>`<option value="${v}" ${filters.status===v?'selected':''}>${l}</option>`).join('')}</select></label></div><div id="inventory-results"></div>`);}
function drawInventory(){const target=document.querySelector('#inventory-results');if(!target)return;let a=analyses().filter(p=>(p.name+' '+p.sku).toLowerCase().includes(filters.q.toLowerCase())&&(filters.category==='all'||p.category===filters.category)&&(filters.status==='all'||filters.status==='expiry'&&p.days>=0&&p.days<=7||filters.status==='low'&&p.reorder>0||filters.status==='expired'&&p.days<0));target.innerHTML=a.length?`<p class="small muted">${a.length} product${a.length===1?'':'s'}</p><div class="tablewrap"><table><thead><tr><th>Product</th><th>On hand</th><th>Selling price</th><th>Expiry</th><th>Status</th><th>Manage</th></tr></thead><tbody>${a.map(p=>`<tr><td><strong>${esc(p.name)}</strong><small>${esc(p.sku)} · ${esc(p.category)}</small></td><td>${p.stock} ${esc(p.unit)}</td><td>${money(p.price)}</td><td>${esc(p.expiry)}</td><td>${tag(p)}</td><td><button class="secondary" data-action="edit" data-sku="${esc(p.sku)}">Edit</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="panel empty"><h2>No matching products.</h2><p>Try another search or clear your filters.</p><button class="secondary" data-action="clear-filters">Clear filters</button></div>';}
const training={expiry:['what expires this week','which items are expiring','show expiry dates','what should I sell first','products going bad soon','stock nearing expiration','what will expire soon'],reorder:['what should I reorder','which products need restocking','make my next order','what stock is running low','recommend purchase quantities','what should I buy next','replenish low inventory'],value:['what is my inventory value','how much is my stock worth','total purchase cost of stock','value of all products','money tied up in inventory','calculate stock valuation','how much inventory capital'],sales:['what sold most','show top selling products','best sellers last week','recent sales by product','which items have highest sales','most popular products','units sold recently'],forecast:['forecast milk sales','predict demand next week','how much milk will sell','estimate future sales','seven day demand forecast','predict next week units','future demand for products']};
const tokens=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean);
const model={};const vocab=new Set();for(const [intent,phrases] of Object.entries(training)){let counts={},total=0;phrases.forEach(s=>tokens(s).forEach(t=>{vocab.add(t);counts[t]=(counts[t]||0)+1;total++;}));model[intent]={counts,total};}
function classify(q){let ts=tokens(q),known=ts.filter(t=>vocab.has(t));if(!known.length)return null;let scores=Object.entries(model).map(([intent,m])=>({intent,score:known.reduce((n,t)=>n+Math.log(((m.counts[t]||0)+1)/(m.total+vocab.size)),Math.log(.2))})).sort((a,b)=>b.score-a.score);return scores[0].score-scores[1].score<.3?null:scores[0].intent;}
function answer(q){if(typeof q!=='string'||!q.trim()||q.length>400)return {intent:null,text:'Please enter a stock question of 1–400 characters.'};let intent=classify(q),a=analyses();if(!intent)return {intent:null,text:'I can help with expiry, reordering, stock value, recent sales and demand forecasts. Please ask one stock question at a time.'};let text='';if(intent==='expiry'){let rows=a.filter(p=>p.days>=0&&p.days<=7).sort((a,b)=>a.days-b.days);text=rows.length?rows.map(p=>`${p.name} (${p.sku}): ${p.days} days left; ${p.stock} ${p.unit} on hand; estimated surplus ${p.excess} units.`).join('\n\n'):'No products expire within seven days of the sample date.';text+='\n\nCheck packaging and condition. Do not sell expired stock.';}if(intent==='reorder'){let rows=a.filter(p=>p.reorder>0);text=rows.length?rows.map(p=>`${p.name} (${p.sku}): review ${p.reorder} units. Estimated ${p.daily.toFixed(1)}/day × (${p.lead} lead days + ${state.buffer} buffer days), minus ${p.stock} in stock.`).join('\n\n'):'No reorder suggested for the current sample inventory.';text+='\n\nReview pack sizes and shelf life before ordering.';}if(intent==='value')text=`Stock at purchase cost: ${money(a.reduce((s,p)=>s+p.cost*p.stock,0))} across ${a.length} products.\n\nCalculated as quantity × purchase cost. This is not revenue or profit.`;if(intent==='sales')text=a.filter(p=>p.history.length).sort((a,b)=>b.history.slice(-7).reduce((x,y)=>x+y,0)-a.history.slice(-7).reduce((x,y)=>x+y,0)).slice(0,3).map((p,i)=>`${i+1}. ${p.name} (${p.sku}): ${p.history.slice(-7).reduce((x,y)=>x+y,0)} units sold, 19–25 September 2026.`).join('\n\n')||'No sales history is available.';if(intent==='forecast'){let ts=tokens(q),match=a.filter(p=>tokens(p.name).some(t=>t.length>2&&ts.includes(t))||ts.includes(p.sku.toLowerCase()));if(!match.length)return {intent,text:'Please name a product in your forecast question, for example “Forecast milk sales”.'};text=match.map(p=>p.mae===null?`${p.name}: add sales history before forecasting; new products have none.`:`${p.name} (${p.sku}): approximately ${p.total} units over the next seven days.\nMethod: ${p.method}. Selection-holdout MAE: ${p.mae.toFixed(2)} units/day.`).join('\n\n')+'\n\nSynthetic history demonstrates the method. The holdout selects the model; it is not an independent final accuracy test.';}return {intent,text};}
const questions=['What expires this week?','What should I reorder?','What is my inventory value?','What sold most?','Forecast milk sales'];
function ask(){return shell('ask',`<h1>Ask your stock a question.</h1><p class="muted intro">A small assistant for five everyday decisions. Answers come from the sample records and your saved stock edits.</p><div class="chips">${questions.map(q=>`<button data-question="${q}">${q}</button>`).join('')}</div><div class="panel"><h2>ShelfSense assistant</h2><p id="answer" class="answer" aria-live="polite">Choose a question above, or write your own below.</p><form id="ask-form" class="askform"><label style="flex:1">Your stock question<input id="question" maxlength="400" required placeholder="For example: what should I reorder?"></label><button style="align-self:end" type="submit">Ask ShelfSense</button></form><div class="meta">Sample reference date: ${ASOF}. Local Naive Bayes question routing and demand calculations. Unsupported or ambiguous questions may need rephrasing. No external AI service.</div></div>`);}
function orders(){let rows=analyses().filter(p=>p.reorder>0);return shell('orders',`<div class="heading"><div><h1>Your next order.</h1><p class="muted">A suggestion to review, not a purchase.</p></div><button data-action="export-orders" class="secondary">Download CSV</button></div><p class="notice">Suggested units = demand × (supplier lead time + ${state.buffer}-day buffer) − current stock, rounded up. Check expiry dates, supplier pack sizes and storage before acting.</p><div class="panel">${rows.length?rows.map(p=>`<div class="row"><div><strong>${esc(p.name)}</strong><p class="small">${p.daily.toFixed(1)} units/day · ${p.lead}-day lead · ${p.stock} on hand</p></div><div><strong>${p.reorder} units</strong><p class="small">${money(p.reorder*p.cost)} estimated cost</p></div></div>`).join(''):'<p>No products need replenishment under the current assumptions.</p>'}<div class="row"><strong>Total estimated purchase cost</strong><strong>${money(rows.reduce((n,p)=>n+p.reorder*p.cost,0))}</strong></div><button data-action="review">Mark plan reviewed</button><p id="review-status" class="small muted" style="margin:15px 0 0">${state.reviewed?'Last reviewed: '+esc(new Date(state.reviewed).toLocaleString()):'This plan has not been marked reviewed.'}</p></div>`);}
function about(){return shell('about',`<h1>Your shop & sample data.</h1><div class="twocol"><div class="panel settings"><h2>Shop preferences</h2><form id="settings-form"><label>Shop name<input name="shop" value="${esc(state.shop)}" required maxlength="60"></label><label>Reorder safety buffer (days)<input name="buffer" type="number" min="0" max="30" step="1" value="${state.buffer}" required></label><button type="submit">Save preferences</button></form><hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><h3>Start again</h3><p class="muted small">Restore the 12 sample products and remove this browser’s edits.</p><button class="secondary" data-action="reset">Reset sample shop</button></div><div class="panel"><h2>About this demonstration</h2><p>Built by <strong>Slow and Curious</strong>. All shop records are synthetic, with 28 daily sales values per original product and a fixed analysis date of 26 September 2026.</p><p class="small muted">This new demo has its own generated sample data. Its totals may differ from the earlier project deck and Figma screens. Newly added products have no historical sales and are excluded from demand-based recommendations.</p><h3>Keep a copy</h3><div class="actions"><button class="secondary" data-action="export-data">Download dataset JSON</button><button class="secondary" data-action="export-evidence">Download five answers</button></div><h3>Privacy</h3><p class="small muted">Edits are stored only in this browser. There is no account, shared database, email collection, payment or supplier connection. Clearing site data removes local edits. Please use sample information only.</p></div></div>`);}
function route(){const hash=location.hash.slice(1)||'home',section=['how','pricing'].includes(hash),view=section?'home':hash;document.querySelector('#main').innerHTML=({home,today,inventory,ask,orders,about}[view]||home)();document.title=`${({today:'Today',inventory:'Inventory',ask:'Ask ShelfSense',orders:'Reorder plan',about:'Shop & data'}[view]||'Less waste. Better stocked.')} — ShelfSense | Slow and Curious`;if(view==='inventory')drawInventory();if(section)requestAnimationFrame(()=>document.getElementById(hash)?.scrollIntoView());else window.scrollTo(0,0);}
const modal=document.querySelector('#modal');
function edit(sku){const p=state.products.find(p=>p.sku===sku),v=p||{name:'',sku:'',category:'Pantry',stock:0,unit:'packs',cost:0,price:0,expiry:dateAdd(ASOF,14),lead:2};modal.innerHTML=`<div class="dialoghead"><h2>${p?'Edit product':'Add a product'}</h2><button class="close" aria-label="Close dialog" data-action="close">×</button></div><form id="product-form" data-original="${esc(sku||'')}" class="dialogbody"><div class="fieldgrid"><label class="full">Product name<input name="name" maxlength="80" required value="${esc(v.name)}"></label><label>SKU / product code<input name="sku" pattern="[A-Za-z0-9_-]{1,24}" maxlength="24" required value="${esc(v.sku)}" ${p?'readonly':''}></label><label>Category<select name="category">${['Dairy','Bakery','Fresh','Drinks','Pantry','Snacks','Other'].map(c=>`<option ${v.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Quantity on hand<div class="quantitybuttons"><button type="button" class="secondary" data-action="minus" aria-label="Decrease quantity">−</button><input name="stock" aria-label="Quantity on hand" type="number" min="0" max="1000000" step="1" required value="${v.stock}"><button type="button" class="secondary" data-action="plus" aria-label="Increase quantity">+</button></div></label><label>Unit<select name="unit">${['packs','units','bottles','bags','boxes','kg'].map(u=>`<option ${v.unit===u?'selected':''}>${u}</option>`).join('')}</select></label><label>Purchase cost (₹ / unit)<input name="cost" type="number" min="0" max="1000000" step=".01" required value="${v.cost}"></label><label>Selling price (₹ / unit)<input name="price" type="number" min="0" max="1000000" step=".01" required value="${v.price}"></label><label>Expiry date<input name="expiry" type="date" required value="${v.expiry}"></label><label>Supplier lead time (days)<input name="lead" type="number" min="0" max="365" step="1" required value="${v.lead}"></label></div><p class="error" id="form-error" role="alert"></p><div class="dialogactions">${p?`<button type="button" class="danger" data-action="delete" data-sku="${esc(p.sku)}">Delete product</button>`:''}<button type="button" class="secondary" data-action="close">Cancel</button><button type="submit">Save product</button></div></form>`;modal.showModal();}
function confirmBox(title,text,action,sku=''){modal.innerHTML=`<div class="dialoghead"><h2>${esc(title)}</h2><button class="close" aria-label="Close dialog" data-action="close">×</button></div><p class="dialogbody">${esc(text)}</p><div class="dialogactions"><button class="secondary" data-action="close">Cancel</button><button class="danger" data-action="${action}" data-sku="${esc(sku)}">Confirm</button></div>`;if(!modal.open)modal.showModal();}
function download(name,text,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type}));let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function showAnswer(q){document.querySelector('#question').value=q;const result=answer(q);document.querySelector('#answer').textContent=result.text;return result;}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-question]');if(!el)return;if(el.dataset.question){showAnswer(el.dataset.question);return;}const act=el.dataset.action,sku=el.dataset.sku;if(act==='close')modal.close();if(act==='add')edit();if(act==='edit')edit(sku);if(act==='plus'||act==='minus'){let n=modal.querySelector('[name=stock]');n.value=Math.min(1000000,Math.max(0,(Number(n.value)||0)+(act==='plus'?1:-1)));}if(act==='delete'){let p=state.products.find(p=>p.sku===sku);confirmBox('Delete this product?',`${p.name} will be removed from this browser’s inventory. Cancel to keep it.`,'confirm-delete',sku);}if(act==='confirm-delete'){state.products=state.products.filter(p=>p.sku!==sku);state.reviewed=null;save();modal.close();route();toast('Product removed.');}if(act==='clear-filters'){filters={q:'',category:'all',status:'all'};route();}if(act==='review'){state.reviewed=new Date().toISOString();save();route();toast('Plan marked reviewed. No order has been sent.');}if(act==='reset')confirmBox('Reset the sample shop?','This removes this browser’s stock edits and restores the original sample.','confirm-reset');if(act==='confirm-reset'){state=initial();save();filters={q:'',category:'all',status:'all'};modal.close();route();toast('Sample shop restored.');}if(act==='export-data')download('shelfsense-dataset.json',JSON.stringify({team:'Slow and Curious',synthetic:true,asOf:ASOF,historyDates:Array.from({length:28},(_,i)=>dateAdd(ASOF,i-28)),...state},null,2));if(act==='export-evidence')download('shelfsense-five-answers.json',JSON.stringify({team:'Slow and Curious',asOf:ASOF,synthetic:true,results:questions.map(question=>({question,...answer(question)}))},null,2));if(act==='export-orders'){const csv=v=>'"'+String(v).replace(/"/g,'""')+'"';download('shelfsense-reorder-plan.csv','SKU,Product,Suggested units,Estimated cost INR\r\n'+analyses().filter(p=>p.reorder>0).map(p=>[p.sku,p.name,p.reorder,p.reorder*p.cost].map(csv).join(',')).join('\r\n'),'text/csv');}});
document.addEventListener('input',e=>{if(e.target.id==='search'){filters.q=e.target.value;drawInventory();}});
document.addEventListener('change',e=>{if(e.target.id==='category'||e.target.id==='status'){filters[e.target.id]=e.target.value;drawInventory();}});
document.addEventListener('submit',e=>{if(e.target.id==='ask-form'){e.preventDefault();showAnswer(document.querySelector('#question').value);}if(e.target.id==='settings-form'){e.preventDefault();const d=new FormData(e.target);state.shop=String(d.get('shop')).trim();state.buffer=Number(d.get('buffer'));if(!state.shop||!Number.isInteger(state.buffer)||state.buffer<0||state.buffer>30)return;state.reviewed=null;save();route();toast('Preferences saved.');}if(e.target.id==='product-form'){e.preventDefault();const d=new FormData(e.target),old=e.target.dataset.original,sku=String(d.get('sku')).trim().toUpperCase(),name=String(d.get('name')).trim();if(!name||!/^[A-Z0-9_-]{1,24}$/.test(sku)){document.querySelector('#form-error').textContent='Enter a name and a valid product code.';return;}if(!old&&state.products.some(p=>p.sku.toUpperCase()===sku)){document.querySelector('#form-error').textContent='This product code already exists. Choose another.';return;}const p={sku,name,category:String(d.get('category')),unit:String(d.get('unit')),stock:Number(d.get('stock')),cost:Number(d.get('cost')),price:Number(d.get('price')),expiry:String(d.get('expiry')),lead:Number(d.get('lead')),history:state.products.find(p=>p.sku===old)?.history||[]};if([p.stock,p.cost,p.price,p.lead].some(n=>!Number.isFinite(n)||n<0)||!Number.isInteger(p.stock)||!Number.isInteger(p.lead)||!Number.isFinite(Date.parse(p.expiry)))return;if(old)state.products[state.products.findIndex(p=>p.sku===old)]=p;else state.products.push(p);state.reviewed=null;save();modal.close();route();toast('Product saved.');}});
window.addEventListener('hashchange',route);route();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_shelfsense_inventory',description:'Read the current local synthetic sample inventory and calculations; does not edit stock.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({asOf:ASOF,products:analyses()})})).catch(()=>{});Promise.resolve(document.modelContext.registerTool({name:'ask_shelfsense_stock',description:'Answer one supported inventory question from the current local sample. No order or edit is made.',inputSchema:{type:'object',properties:{question:{type:'string',minLength:1,maxLength:400}},required:['question'],additionalProperties:false},annotations:{readOnlyHint:true},execute:input=>{if(typeof input?.question!=='string'||!input.question.trim()||input.question.length>400)throw new Error('A question of 1–400 characters is required.');return {asOf:ASOF,...answer(input.question)};}})).catch(()=>{});}catch(e){}}
</script></body></html>
